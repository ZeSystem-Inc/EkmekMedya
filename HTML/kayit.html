<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkmekMedya - Kayıt Ol</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>

    <div class="container" style="max-width: 400px; margin-top: 50px;">
        <header class="profile-card" style="text-align: center;">
            <h1>🍞 EkmekMedya</h1>
            <p class="bio">Fırına katıl, kendi fırınını kur!</p>
        </header>

        <section class="panel">
            <h2>Kayıt Ol</h2>
            <input type="text" id="regUsernameInput" class="input-field" placeholder="Kullanıcı Adı (Örn: firinci_salih)">
            <input type="email" id="regEmailInput" class="input-field" placeholder="E-posta adresiniz">
            <input type="password" id="regPasswordInput" class="input-field" placeholder="Şifreniz (En az 6 karakter)">
            
            <button id="registerBtn" class="btn-primary" style="margin-top: 5px;">Kayıt Ol</button>
            <p id="authMessage" style="color: #f87171; font-size: 13px; margin-top: 8px;"></p>
            
            <p style="margin-top: 15px; font-size: 13px; text-align: center; color: #94a3b8;">
                Zaten hesabın var mı? <a href="giris.html" style="color: #f59e0b;">Giriş Yap</a>
            </p>
            <p style="margin-top: 8px; font-size: 13px; text-align: center;">
                <a href="../index.html" style="color: #94a3b8; text-decoration: none;">← Ana Sayfaya Dön</a>
            </p>
        </section>
    </div>

    <script type="module" src="../script/kayit.js"></script>
</body>
</html>
