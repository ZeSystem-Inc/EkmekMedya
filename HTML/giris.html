<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkmekMedya - Giriş Yap</title>
    <link rel="stylesheet" href="../style/style.css">
</head>
<body>

    <div class="container">
        <header class="profile-card">
            <h1>🍞 EkmekMedya</h1>
            <p class="bio">Fırına tekrar hoş geldin!</p>
        </header>

        <section class="new-post-box">
            <h2>Hesabına Giriş Yap</h2>
            <input type="email" id="loginEmailInput" placeholder="E-posta adresiniz">
            <input type="password" id="loginPasswordInput" placeholder="Şifreniz">
            
            <button id="loginBtn" style="width: 100%; margin-top: 10px;">Giriş Yap</button>
            <p id="authMessage" class="error-msg"></p>
            
            <p style="margin-top: 15px; font-size: 13px; text-align: center; color: #94a3b8;">
                Hesabın yok mu? <a href="kayit.html" style="color: #f59e0b;">Kayıt Ol</a>
            </p>
            <p style="margin-top: 10px; font-size: 13px; text-align: center;">
                <a href="../index.html" style="color: #94a3b8; text-decoration: none;">← Ana Sayfaya Dön</a>
            </p>
        </section>
    </div>

    <script type="module" src="../script/giris.js"></script>
</body>
</html>
