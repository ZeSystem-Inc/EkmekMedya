<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkmekMedya - Topluluk</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-brand">
            <h1 onclick="window.location.reload()">🍞 EkmekMedya</h1>
        </div>
        <div id="authNavButtons" class="nav-auth">
        </div>
    </header>

    <div class="layout">
        <aside>
            <div class="panel">
                <h3>🔥 Fırınlar (Topluluklar)</h3>
                <ul id="firinList" class="firin-list">
                    <li>Yükleniyor...</li>
                </ul>
            </div>

            <!-- Fırın Başlatma Kutusu (Giriş Yapınca Görünür) -->
            <div id="createFirinBox" class="panel" style="display: none;">
                <h3>➕ Fırın Başlat</h3>
                <input type="text" id="firinNameInput" class="input-field" placeholder="Fırın Adı (Örn: Oyun)">
                <input type="text" id="firinSlugInput" class="input-field" placeholder="Slug (Örn: oyun)">
                <button id="createFirinBtn" class="btn-primary">Fırın Aç</button>
            </div>
        </aside>

        <!-- ORTA AKIŞ: Gönderiler ve Yorumlar -->
        <main>
            <!-- Gönderi Oluşturma Kutusu (Giriş Yapınca Görünür) -->
            <div id="postCreateBox" class="panel" style="display: none;">
                <h3>🍞 Fırına Paylaşım Yap</h3>
                <select id="firinSelect" class="input-field"></select>
                <input type="text" id="postTitleInput" class="input-field" placeholder="Başlık">
                <textarea id="postContentInput" class="input-field" rows="3" placeholder="Fikrini paylaş..."></textarea>
                <button id="submitPostBtn" class="btn-primary">Paylaş</button>
            </div>

            <div class="community-header">
                <h2 id="currentFeedTitle">🌍 Ana Akış</h2>
            </div>

            <div id="postsFeed">Gönderiler yükleniyor...</div>
        </main>

        <!-- SAĞ MENÜ: Profil & Başarımlar -->
        <aside>
            <div id="profilePanel" class="panel">
                <h3>👤 Profiliniz</h3>
                <p id="userStats" style="font-size: 13px; color: #94a3b8;">Giriş yapılmadı.</p>
            </div>

            <div class="panel">
                <h3>🏆 Başarımlarınız</h3>
                <div id="achievementsList" style="font-size: 13px; color: #94a3b8;">Giriş yapıldığında görünür.</div>
            </div>
        </aside>
    </div>

    <script type="module" src="script/app.js"></script>
</body>
</html>
