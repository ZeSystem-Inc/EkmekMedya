<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkmekMedya - Topluluk</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-brand">
            <h1>🍞 EkmekMedya</h1>
        </div>
        <div id="authNavButtons" class="nav-auth">
            <!-- JS ile dinamik doldurulacak (Giriş Yap / Kayıt Ol veya Profil / Çıkış) -->
        </div>
    </header>

    <div class="container">
        <section class="welcome-card">
            <h2>Fırına Hoş Geldin!</h2>
            <p>En taze fikirlerin, sıcak paylaşımların ve keyifli sohbetlerin buluştuğu topluluk alanı.</p>
        </section>

        <section id="postSection" class="post-box" style="display: none;">
            <h3>Fırına Yeni Bir Ekmek Bırak</h3>
            <textarea id="contentInput" placeholder="Neler oluyor? Toplulukla bir fikir paylaş..." maxlength="280"></textarea>
            <div class="form-footer">
                <span id="charCount">280</span>
                <button id="shareBtn">🍞 Paylaş</button>
            </div>
        </section>

        <div class="community-header">
            <h2>🌍 Topluluk Akışı</h2>
            <span class="community-subtitle">Herkese açık son paylaşımlar</span>
        </div>

        <main class="feed" id="postsContainer">
        </main>
    </div>

    <script type="module" src="script/app.js"></script>
</body>
</html>
