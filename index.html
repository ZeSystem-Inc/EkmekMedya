<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkmekMedya - Giriş Yap</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <div class="container">
        <header class="profile-card">
            <h1>🍞 EkmekMedya</h1>
            <p class="bio">En taze fikirler, en sıcak akış!</p>
        </header>

        <section id="authSection" class="new-post-box">
            <h2>Hesap İşlemleri</h2>
            <input type="email" id="emailInput" placeholder="E-posta adresiniz">
            <input type="password" id="passwordInput" placeholder="Şifreniz">
            <div class="auth-buttons">
                <button id="loginBtn">Giriş Yap</button>
                <button id="registerBtn" class="secondary-btn">Kayıt Ol</button>
            </div>
            <p id="authMessage" class="error-msg"></p>
        </section>

        <section id="postSection" class="new-post-box" style="display: none;">
            <div class="user-info-bar">
                <span id="currentUserText">Hoş geldin!</span>
                <button id="logoutBtn" class="logout-btn">Çıkış Yap</button>
            </div>
            <textarea id="contentInput" placeholder="Neler oluyor? Bir fırın dolusu fikir paylaş..." maxlength="280"></textarea>
            <div class="form-footer">
                <span id="charCount">280</span>
                <button id="shareBtn">🍞 Fırına Ver (Paylaş)</button>
            </div>
        </section>

        <main class="feed" id="postsContainer">
        </main>
    </div>

    <script type="module" src="script/app.js"></script>
</body>
</html>
